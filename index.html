<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>NVANH OFFICIAL - CHIA SẺ FILE MIỄN PHÍ</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   RESET & VARIABLES
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --red:#dc2626;
  --red-l:#ef4444;
  --red-d:#b91c1c;
  --red-s:rgba(220,38,38,.08);
  --red-b:rgba(220,38,38,.18);
  --red-g:rgba(220,38,38,.28);

  --n0:#fafafa;
  --n1:#f4f4f5;
  --n2:#e4e4e7;
  --n3:#d4d4d8;
  --white:#ffffff;

  --ok:#10b981;
  --ok-s:rgba(16,185,129,.10);
  --ok-b:rgba(16,185,129,.22);

  --wn:#f59e0b;
  --wn-s:rgba(245,158,11,.10);
  --wn-b:rgba(245,158,11,.22);

  --er:#ef4444;
  --er-s:rgba(239,68,68,.10);
  --er-b:rgba(239,68,68,.22);

  --t0:#09090b;
  --t1:#18181b;
  --t2:#3f3f46;
  --t3:#52525b;
  --t4:#71717a;
  --t5:#a1a1aa;

  --bd:rgba(24,24,27,.08);
  --bd2:rgba(24,24,27,.14);
  --bd3:rgba(24,24,27,.20);

  --fh:'Sora',sans-serif;
  --fb:'Sora',sans-serif;
  --fm:'Fira Code',monospace;

  --r1:8px;
  --r2:12px;
  --r3:16px;
  --r4:20px;
  --r5:24px;
  --r6:32px;

  --sh1:0 1px 3px rgba(24,24,27,.06),0 1px 2px rgba(24,24,27,.04);
  --sh2:0 4px 12px rgba(24,24,27,.08),0 2px 4px rgba(24,24,27,.04);
  --sh3:0 12px 32px rgba(24,24,27,.12),0 4px 8px rgba(24,24,27,.06);
  --sh4:0 24px 60px rgba(24,24,27,.18),0 8px 16px rgba(24,24,27,.08);

  --tr:all .25s cubic-bezier(.4,0,.2,1);
  --tr-s:all .35s cubic-bezier(.34,1.56,.64,1);

  --mouse-x:50%;
  --mouse-y:50%;
}

body.dark{
  --n0:#0a0a0b;
  --n1:#18181b;
  --n2:#27272a;
  --n3:#3f3f46;
  --white:#1c1c1f;

  --t0:#fafafa;
  --t1:#f4f4f5;
  --t2:#d4d4d8;
  --t3:#a1a1aa;
  --t4:#71717a;
  --t5:#52525b;

  --bd:rgba(255,255,255,.06);
  --bd2:rgba(255,255,255,.10);
  --bd3:rgba(255,255,255,.16);

  --sh1:0 1px 3px rgba(0,0,0,.3);
  --sh2:0 4px 12px rgba(0,0,0,.4);
  --sh3:0 12px 32px rgba(0,0,0,.5);
  --sh4:0 24px 60px rgba(0,0,0,.6);
}

html,body{
  background:var(--n0);
  min-height:100vh;
  overflow-x:hidden;
  color:var(--t1);
  font-family:var(--fb);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .3s,color .3s;
}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--n1)}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:10px}

/* ═══════════════════════════════════════════════════════════
   BACKGROUND EFFECTS
   ═══════════════════════════════════════════════════════════ */
#bgGradient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  transition:background 1s ease;
}
#bgCanvas{
  position:fixed;inset:0;z-index:1;pointer-events:none;
}
.bg-overlay{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(rgba(220,38,38,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,38,38,.03) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 0%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 0%,transparent 80%);
}
.bg-wave{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(circle at var(--mouse-x) var(--mouse-y),
    rgba(220,38,38,.06) 0%,transparent 40%);
  transition:background .3s;
}

/* ═══════════════════════════════════════════════════════════
   LOADER
   ═══════════════════════════════════════════════════════════ */
#load{
  position:fixed;inset:0;background:var(--white);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;
  z-index:99999;
  transition:background .3s;
}
#load .logo{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--red),var(--red-d));
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#fff;font-family:var(--fh);font-weight:800;
  box-shadow:0 12px 32px var(--red-g);
  animation:logoBounce 1.4s ease-in-out infinite;
  position:relative;
}
#load .logo::after{
  content:'';position:absolute;inset:-8px;border-radius:24px;
  border:2px solid var(--red);opacity:.3;
  animation:logoPulse 1.8s ease-out infinite;
}
@keyframes logoBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes logoPulse{
  0%{transform:scale(1);opacity:.4}
  100%{transform:scale(1.3);opacity:0}
}
#load .txt{
  font-family:var(--fh);font-weight:800;font-size:.85rem;
  color:var(--t4);letter-spacing:12px;text-transform:uppercase;
  animation:txtBlink 1.6s ease-in-out infinite;
}
@keyframes txtBlink{0%,100%{opacity:.35}50%{opacity:1}}

/* ═══════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════ */
#app{
  display:none;position:relative;z-index:10;
  max-width:1000px;margin:0 auto;padding:16px 16px 60px;
}
#app.on{display:block;animation:appIn .5s cubic-bezier(.4,0,.2,1)}
@keyframes appIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════════════════
   API OFF BANNER
   ═══════════════════════════════════════════════════════════ */
#api-off-banner{
  position:fixed;top:0;left:0;right:0;z-index:99998;
  padding:12px 20px;text-align:center;
  background:linear-gradient(135deg,var(--er),#b91c1c);
  color:#fff;font-family:var(--fh);font-weight:700;
  font-size:.82rem;letter-spacing:.2px;
  box-shadow:0 4px 20px rgba(220,38,38,.4);
  animation:slideDown .4s ease;
}
#api-off-banner i{margin-right:8px}
@keyframes slideDown{
  from{transform:translateY(-100%)}
  to{transform:translateY(0)}
}

/* ═══════════════════════════════════════════════════════════
   HERO
   ═══════════════════════════════════════════════════════════ */
.hero{
  position:relative;border-radius:var(--r5);
  overflow:hidden;margin-bottom:16px;
  border:1px solid var(--bd);
  box-shadow:var(--sh3);
  background:var(--white);
  min-height:140px;
  transition:background .3s,border-color .3s;
}
.hero img{
  width:100%;height:auto;display:block;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}
.hero:hover img{transform:scale(1.03)}
.hero .overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 30%,rgba(9,9,11,.75) 100%);
  pointer-events:none;
}
.hero .content{
  position:absolute;bottom:0;left:0;right:0;
  padding:20px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.hero .content .badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:100px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  font-family:var(--fm);font-size:.58rem;font-weight:700;
  color:#fff;letter-spacing:1.4px;text-transform:uppercase;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.hero .content .badge i{font-size:.68rem}

/* ═══════════════════════════════════════════════════════════
   BUTTONS — THIẾT KẾ LẠI
   ═══════════════════════════════════════════════════════════ */
.btn-lv2{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:100px;
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;
  font-family:var(--fh);font-weight:800;font-size:.75rem;
  letter-spacing:1px;text-transform:uppercase;
  border:none;cursor:pointer;
  box-shadow:0 8px 24px var(--red-g);
  transition:var(--tr);
  position:relative;overflow:hidden;
}
.btn-lv2::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%);
  transition:transform .7s ease;
}
.btn-lv2:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px var(--red-g);
}
.btn-lv2:hover::before{transform:translateX(100%)}
.btn-lv2 .btn-icon{
  width:20px;height:20px;
  object-fit:contain;
  flex-shrink:0;
}

/* Nút chính — thiết kế lại gọn đẹp hơn */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:var(--r2);
  border:1.5px solid transparent;
  font-family:var(--fh);font-weight:700;font-size:.8rem;
  cursor:pointer;transition:var(--tr);
  position:relative;overflow:hidden;
  min-height:44px;text-decoration:none;
  letter-spacing:.2px;
  line-height:1;
}
.bt:active{transform:scale(.97)}
.bt:disabled{opacity:.6;cursor:not-allowed}
.bt-p{
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;
  box-shadow:0 4px 16px var(--red-g);
}
.bt-p:hover:not(:disabled){
  box-shadow:0 10px 28px var(--red-g);
  transform:translateY(-2px);
}
.bt-s{
  background:linear-gradient(135deg,var(--ok),#059669);
  color:#fff;
  box-shadow:0 4px 16px var(--ok-b);
}
.bt-s:hover:not(:disabled){
  box-shadow:0 10px 28px var(--ok-b);
  transform:translateY(-2px);
}
.bt-d{
  background:linear-gradient(135deg,var(--er),#b91c1c);
  color:#fff;
  box-shadow:0 4px 16px var(--er-b);
}
.bt-d:hover:not(:disabled){
  box-shadow:0 10px 28px var(--er-b);
  transform:translateY(-2px);
}
.bt-w{
  background:linear-gradient(135deg,var(--wn),#d97706);
  color:#fff;
  box-shadow:0 4px 16px var(--wn-b);
}
.bt-g{
  background:var(--white);
  color:var(--t2);
  border-color:var(--bd2);
}
.bt-g:hover:not(:disabled){
  background:var(--n1);
  color:var(--t0);
  border-color:var(--bd3);
}
.bt .rp{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.3);
  transform:scale(0);
  animation:rpA .6s ease-out;
  pointer-events:none;
}
.bt-g .rp{background:rgba(220,38,38,.15)}
@keyframes rpA{to{transform:scale(4);opacity:0}}

.btn-icon{
  width:18px;height:18px;
  object-fit:contain;
  vertical-align:middle;
  flex-shrink:0;
  display:inline-block;
}

/* ═══════════════════════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════════════════════ */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:16px;
}
.stat{
  padding:18px 14px;
  background:var(--white);
  border:1px solid var(--bd);
  border-radius:var(--r4);
  text-align:left;
  box-shadow:var(--sh1);
  transition:var(--tr), background .3s, border-color .3s;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;
  top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--red),var(--red-l));
  transform:scaleX(0);transform-origin:left;
  transition:var(--tr);
}
.stat:hover{
  border-color:var(--red-b);
  transform:translateY(-3px);
  box-shadow:var(--sh3);
}
.stat:hover::before{transform:scaleX(1)}
.stat .top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.stat .top .icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--red-s);border:1px solid var(--red-b);
  display:flex;align-items:center;justify-content:center;
  color:var(--red);font-size:.9rem;
  transition:background .3s;
}
.stat .top .trend{
  font-family:var(--fm);font-size:.58rem;
  color:var(--ok);font-weight:700;
  display:flex;align-items:center;gap:3px;
  padding:3px 8px;border-radius:6px;
  background:var(--ok-s);
}
.stat .num{
  font-family:var(--fh);font-weight:800;
  font-size:1.55rem;line-height:1;letter-spacing:-.8px;
  color:var(--t0);
  margin-bottom:5px;
}
.stat .lbl{
  font-family:var(--fm);font-size:.58rem;
  color:var(--t4);text-transform:uppercase;
  letter-spacing:1.5px;font-weight:600;
}

/* ═══════════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════════ */
.srch{
  display:flex;align-items:center;gap:0;
  padding:6px;margin-bottom:16px;
  background:var(--white);
  border:1.5px solid var(--bd2);
  border-radius:var(--r4);
  box-shadow:var(--sh1);
  transition:var(--tr), background .3s, border-color .3s;
}
.srch:focus-within{
  border-color:var(--red);
  box-shadow:0 0 0 4px var(--red-s),var(--sh2);
}
.srch .ic{
  color:var(--t4);font-size:.95rem;
  padding:0 12px 0 16px;flex-shrink:0;
  transition:var(--tr);
}
.srch:focus-within .ic{color:var(--red)}
.srch input{
  flex:1;background:transparent;
  border:none;outline:none;
  color:var(--t0);padding:13px 6px;
  font-size:.9rem;font-family:var(--fb);font-weight:500;
  min-width:0;
}
.srch input::placeholder{color:var(--t5);font-weight:400}
.srch .cnt{
  font-family:var(--fm);font-size:.68rem;
  color:var(--red);font-weight:700;
  padding:0 12px;white-space:nowrap;flex-shrink:0;
}
.srch .clr{
  background:var(--n1);border:none;color:var(--t4);
  padding:9px 13px;border-radius:9px;
  cursor:pointer;font-size:.82rem;
  display:none;transition:var(--tr);flex-shrink:0;
}
.srch .clr:hover{background:var(--red-s);color:var(--red)}
.srch .clr.on{display:block}

/* ═══════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════ */
.tabs{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:6px;padding:6px;
  margin-bottom:14px;
  background:var(--white);
  border:1px solid var(--bd);
  border-radius:var(--r4);
  box-shadow:var(--sh1);
  transition:background .3s, border-color .3s;
}
.tb{
  background:transparent;border:none;
  color:var(--t3);padding:12px 10px;
  border-radius:var(--r2);
  font-family:var(--fh);font-weight:700;font-size:.8rem;
  cursor:pointer;transition:var(--tr);
  display:flex;align-items:center;justify-content:center;gap:8px;
  white-space:nowrap;letter-spacing:.2px;
}
.tb i{font-size:.82rem;transition:var(--tr)}
.tb.on{
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;
  box-shadow:0 6px 18px var(--red-g);
}
.tb.on i{transform:scale(1.15)}
.tb:hover:not(.on){color:var(--t0);background:var(--n1)}

.subs{
  display:flex;gap:6px;padding:5px;
  margin-bottom:14px;
  background:var(--white);
  border:1px solid var(--bd);
  border-radius:var(--r3);
  overflow-x:auto;scrollbar-width:none;
  box-shadow:var(--sh1);
  transition:background .3s, border-color .3s;
}
.subs::-webkit-scrollbar{display:none}
.sb{
  flex:1;min-width:fit-content;
  background:transparent;
  border:1px solid transparent;
  color:var(--t3);padding:10px 16px;
  border-radius:9px;
  font-family:var(--fh);font-weight:600;font-size:.74rem;
  cursor:pointer;transition:var(--tr);
  display:flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;letter-spacing:.2px;
}
.sb i{font-size:.72rem}
.sb.on{
  background:var(--red-s);
  color:var(--red);
  border-color:var(--red-b);
  font-weight:700;
}
.sb:hover:not(.on){color:var(--t0);background:var(--n1)}

.pn{display:none;animation:pnIn .3s ease}
.pn.on{display:block}
.sp{display:none;animation:pnIn .25s ease}
.sp.on{display:block}
@keyframes pnIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════════════════
   FILE LIST
   ═══════════════════════════════════════════════════════════ */
.fl{display:flex;flex-direction:column;gap:8px}
.fi{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  background:var(--white);
  border:1px solid var(--bd);
  border-radius:var(--r3);
  cursor:pointer;transition:var(--tr);
  position:relative;overflow:hidden;
  box-shadow:var(--sh1);
}
.fi::before{
  content:'';position:absolute;
  top:0;left:0;height:100%;width:4px;
  background:linear-gradient(180deg,var(--red),var(--red-l));
  transform:scaleY(0);transform-origin:bottom;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.fi:hover{
  border-color:var(--red-b);
  transform:translateY(-2px);
  box-shadow:var(--sh3);
}
.fi:hover::before{transform:scaleY(1)}
.fi .fiic{
  width:50px;height:50px;min-width:50px;
  border-radius:var(--r2);
  background:linear-gradient(135deg,var(--red-s),var(--red-s));
  border:1px solid var(--red-b);
  display:flex;align-items:center;justify-content:center;
  color:var(--red);font-size:1.15rem;
  transition:var(--tr-s);
}
.fi:hover .fiic{
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;border-color:transparent;
  box-shadow:0 8px 24px var(--red-g);
  transform:scale(1.08) rotate(-4deg);
}
.fi .finfo{flex:1;min-width:0}
.fi .finm{
  color:var(--t0);font-weight:700;
  font-size:.92rem;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.1px;
}
.fi .fimt{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin-top:6px;color:var(--t4);font-size:.68rem;
  font-family:var(--fm);
}
.fi .fimt .fmi{display:flex;align-items:center;gap:3px}
.fi .fimt .fmi i{font-size:.62rem;opacity:.8}
.tg{
  display:inline-flex;align-items:center;gap:3px;
  padding:3px 9px;border-radius:6px;
  font-size:.58rem;font-weight:700;letter-spacing:.4px;
  font-family:var(--fm);
}
.tg-hot{background:var(--er-s);color:var(--er);animation:hotPulse 1.8s ease-in-out infinite}
@keyframes hotPulse{0%,100%{opacity:1}50%{opacity:.55}}
.tg-new{background:var(--ok-s);color:var(--ok)}
.tg-ver{background:var(--wn-s);color:var(--wn)}
.tg-cat{background:var(--red-s);color:var(--red)}
.fi .fiarr{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t5);font-size:.72rem;
  background:var(--n1);
  transition:var(--tr);flex-shrink:0;
}
.fi:hover .fiarr{
  background:var(--red);color:#fff;
  transform:translateX(3px);
}

.emp{
  padding:64px 24px;text-align:center;
  background:var(--white);
  border:2px dashed var(--bd2);
  border-radius:var(--r4);
}
.emp i{
  font-size:2.5rem;color:var(--t5);
  display:block;margin-bottom:16px;opacity:.5;
}
.emp p{color:var(--t4);font-size:.85rem;font-weight:500}

/* ═══════════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════════ */
.ft{
  margin-top:48px;padding:28px 24px;text-align:center;
  background:var(--white);
  border:1px solid var(--bd);
  border-radius:var(--r4);
  box-shadow:var(--sh1);
  transition:background .3s, border-color .3s;
}
.ft .msg{color:var(--t3);font-size:.82rem;margin-bottom:10px;font-weight:500}
.ft .brand{
  font-family:var(--fh);font-weight:800;font-size:.7rem;
  color:var(--t5);letter-spacing:8px;text-transform:uppercase;
}
.ft .brand span{
  background:linear-gradient(135deg,var(--red),var(--red-l));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ═══════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════ */
#tsts{
  position:fixed;top:20px;right:20px;z-index:99999;
  display:flex;flex-direction:column;gap:10px;
  max-width:380px;width:calc(100% - 40px);
}
.ts{
  padding:14px 18px;
  background:var(--white);
  border:1.5px solid var(--bd2);
  border-radius:var(--r3);
  color:var(--t0);
  font-weight:500;font-size:.82rem;
  box-shadow:var(--sh4);
  display:flex;align-items:center;gap:12px;
  animation:tsIn .4s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  transition:background .3s, border-color .3s;
}
.ts::before{
  content:'';position:absolute;
  left:0;top:0;bottom:0;width:4px;
  background:var(--red);
}
.ts.info::before{background:var(--red)}
.ts.success::before{background:var(--ok)}
.ts.error::before{background:var(--er)}
.ts.warning::before{background:var(--wn)}
.ts i{font-size:1.05rem;flex-shrink:0}
.ts.info i{color:var(--red)}
.ts.success i{color:var(--ok)}
.ts.error i{color:var(--er)}
.ts.warning i{color:var(--wn)}
@keyframes tsIn{
  from{opacity:0;transform:translateX(60px) scale(.9)}
  to{opacity:1;transform:none}
}

/* ═══════════════════════════════════════════════════════════
   MODALS — THIẾT KẾ LẠI
   ═══════════════════════════════════════════════════════════ */
.ov{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(9,9,11,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  align-items:center;justify-content:center;padding:16px;
}
.ov.on{display:flex}
.mb{
  max-width:540px;width:100%;padding:28px;
  background:var(--white);
  border:1px solid var(--bd2);
  border-radius:var(--r5);
  max-height:92vh;overflow-y:auto;
  box-shadow:var(--sh4);
  animation:mbIn .35s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  transition:background .3s, border-color .3s;
}
@keyframes mbIn{
  from{opacity:0;transform:scale(.94) translateY(20px)}
  to{opacity:1;transform:none}
}
.mh{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;padding-bottom:16px;
  border-bottom:1px solid var(--bd);
}
.mh h3{
  font-family:var(--fh);font-weight:800;font-size:1rem;
  display:flex;align-items:center;gap:10px;color:var(--t0);
  letter-spacing:-.2px;
}
.mh h3 i{
  width:32px;height:32px;border-radius:9px;
  background:var(--red-s);color:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;
}
.mc{
  background:var(--n1);border:none;
  width:36px;height:36px;border-radius:10px;
  color:var(--t4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;line-height:1;
  transition:var(--tr);
}
.mc:hover{
  background:var(--red-s);color:var(--red);
  transform:rotate(90deg);
}
.mbody{color:var(--t1)}
.mf{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:18px;padding-top:16px;
  border-top:1px solid var(--bd);
}

/* ═══════════════════════════════════════════════════════════
   MODAL QC / MUA LINK — THIẾT KẾ LẠI ĐẸP + NỀN KẺ Ô VUÔNG
   ═══════════════════════════════════════════════════════════ */
.ov.qc-flow .mb{
  max-width:480px;
  padding:0;
  overflow:hidden;
  position:relative;
}

/* Nền kẻ ô vuông cho modal QC */
.ov.qc-flow .mb::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(220,38,38,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,38,38,.06) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
}
.ov.qc-flow .mb::after{
  content:'';position:absolute;
  top:-30%;right:-20%;width:60%;height:80%;
  background:radial-gradient(circle,rgba(220,38,38,.12) 0%,transparent 70%);
  filter:blur(50px);
  pointer-events:none;
  z-index:0;
  animation:qcGlow 3s ease-in-out infinite;
}
@keyframes qcGlow{
  0%,100%{opacity:.6;transform:scale(1)}
  50%{opacity:1;transform:scale(1.1)}
}

.ov.qc-flow .qc-header{
  position:relative;z-index:1;
  padding:22px 24px 18px;
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(10px);
}
body.dark .ov.qc-flow .qc-header{
  background:rgba(28,28,31,.6);
}
.ov.qc-flow .qc-header h3{
  font-family:var(--fh);font-weight:800;font-size:.95rem;
  color:var(--t0);display:flex;align-items:center;gap:10px;
}
.ov.qc-flow .qc-header h3 i{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;
  box-shadow:0 4px 12px var(--red-g);
}
.ov.qc-flow .qc-body{
  position:relative;z-index:1;
  padding:22px 24px 24px;
}
.ov.qc-flow .qc-footer{
  position:relative;z-index:1;
  padding:14px 24px 20px;
  border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;
  background:rgba(255,255,255,.4);
}
body.dark .ov.qc-flow .qc-footer{
  background:rgba(28,28,31,.4);
}

/* File info card trong modal QC */
.qc-file-card{
  display:flex;align-items:center;gap:14px;
  padding:16px;
  background:var(--white);
  border:1.5px solid var(--bd2);
  border-radius:var(--r3);
  margin-bottom:18px;
  box-shadow:var(--sh1);
  position:relative;overflow:hidden;
}
.qc-file-card::before{
  content:'';position:absolute;
  top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--red),var(--red-l));
}
.qc-file-card .qc-fic{
  width:48px;height:48px;min-width:48px;
  border-radius:var(--r2);
  background:linear-gradient(135deg,var(--red-s),var(--red-s));
  border:1px solid var(--red-b);
  display:flex;align-items:center;justify-content:center;
  color:var(--red);font-size:1.1rem;
}
.qc-file-card .qc-finfo{flex:1;min-width:0}
.qc-file-card .qc-fname{
  font-family:var(--fh);font-weight:700;font-size:.88rem;
  color:var(--t0);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.3;
}
.qc-file-card .qc-fmeta{
  display:flex;align-items:center;gap:10px;
  margin-top:5px;color:var(--t4);
  font-family:var(--fm);font-size:.65rem;
}

/* Nút chọn trong modal QC */
.qc-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.qc-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;
  padding:20px 14px;
  border-radius:var(--r3);
  border:1.5px solid transparent;
  cursor:pointer;
  transition:var(--tr);
  font-family:var(--fh);font-weight:700;font-size:.82rem;
  position:relative;overflow:hidden;
  text-align:center;
  min-height:90px;
}
.qc-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transform:translateX(-100%);
  transition:transform .7s ease;
}
.qc-btn:hover::before{transform:translateX(100%)}
.qc-btn:active{transform:scale(.97)}
.qc-btn .qc-bic{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  transition:var(--tr-s);
}
.qc-btn:hover .qc-bic{transform:scale(1.12) rotate(-6deg)}
.qc-btn .qc-btxt{line-height:1.2}
.qc-btn .qc-bsub{
  font-family:var(--fm);font-size:.6rem;
  font-weight:600;opacity:.7;margin-top:3px;
}

.qc-btn-bypass{
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;
  box-shadow:0 6px 20px var(--red-g);
}
.qc-btn-bypass:hover{
  box-shadow:0 10px 32px var(--red-g);
  transform:translateY(-3px);
}
.qc-btn-bypass .qc-bic{
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.25);
}

.qc-btn-buy{
  background:linear-gradient(135deg,var(--ok),#059669);
  color:#fff;
  box-shadow:0 6px 20px var(--ok-b);
}
.qc-btn-buy:hover{
  box-shadow:0 10px 32px var(--ok-b);
  transform:translateY(-3px);
}
.qc-btn-buy .qc-bic{
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.25);
}

.qc-btn-error{
  grid-column:span 2;
  flex-direction:row;
  min-height:auto;
  padding:13px 18px;
  background:var(--white);
  color:var(--er);
  border-color:var(--er-b);
  font-size:.78rem;
  gap:8px;
}
.qc-btn-error:hover{
  background:var(--er-s);
  border-color:var(--er);
  transform:translateY(-2px);
}
.qc-btn-error .qc-bic{
  width:28px;height:28px;
  background:var(--er-s);
  border-radius:8px;
  font-size:.8rem;
  color:var(--er);
}

/* API Picker — thiết kế lại */
.api-picker{
  display:flex;flex-direction:column;gap:10px;
  margin-top:16px;
}
.api-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  background:var(--white);
  border:1.5px solid var(--bd2);
  border-radius:var(--r3);
  cursor:pointer;
  transition:var(--tr);
  text-align:left;
  position:relative;overflow:hidden;
}
.api-item::before{
  content:'';position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red),var(--red-l));
  transform:scaleY(0);transform-origin:bottom;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.api-item:hover:not(.disabled)::before{transform:scaleY(1)}
.api-item:hover:not(.disabled){
  border-color:var(--red);
  background:var(--red-s);
  transform:translateX(4px);
}
.api-item.disabled{
  opacity:.45;
  cursor:not-allowed;
  background:var(--n1);
  border-color:var(--bd);
}
.api-item.disabled:hover{
  transform:none;
  background:var(--n1);
  border-color:var(--bd);
}
.api-item .api-ic{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--red),var(--red-d));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.1rem;
  flex-shrink:0;
  box-shadow:0 6px 18px var(--red-g);
  transition:var(--tr-s);
}
.api-item:hover:not(.disabled) .api-ic{
  transform:scale(1.08) rotate(-4deg);
}
.api-item.disabled .api-ic{
  background:var(--n3);
  box-shadow:none;
}
.api-item .api-info{flex:1;min-width:0}
.api-item .api-name{
  font-family:var(--fh);font-weight:700;
  font-size:.9rem;color:var(--t0);
}
.api-item .api-desc{
  font-family:var(--fm);font-size:.65rem;
  color:var(--t4);margin-top:3px;
}
.api-item .api-badge{
  padding:4px 10px;border-radius:20px;
  font-family:var(--fm);font-size:.6rem;
  font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;
  background:var(--red-s);color:var(--red);
  border:1px solid var(--red-b);
  flex-shrink:0;
}
.api-item.disabled .api-badge{
  background:var(--n2);color:var(--t4);
  border-color:var(--bd);
}

/* ═══════════════════════════════════════════════════════════
   PAYMENT MODAL
   ═══════════════════════════════════════════════════════════ */
.pay .mb{max-width:500px;padding:0;overflow:hidden}
.pay .mh{padding:24px 26px 16px;margin:0}
.pay .mbody{padding:0 26px 22px}
.pay .mf{padding:16px 26px 22px;margin:0}

.pfi{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 16px;margin-bottom:14px;
  background:linear-gradient(135deg,var(--red-s),var(--red-s));
  border:1px solid var(--red-b);
  border-radius:var(--r3);
}
.pfi .pfn{
  font-weight:700;font-size:.85rem;color:var(--t0);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:10px;
}
.pfi .pfn i{color:var(--red)}
.pfi .pfp{
  background:linear-gradient(135deg,var(--red),var(--red-d));
  color:#fff;padding:6px 16px;
  border-radius:100px;
  font-family:var(--fm);font-weight:700;font-size:.78rem;
  white-space:nowrap;
  box-shadow:0 4px 12px var(--red-g);
}

.pq{
  background:var(--n1);
  border-radius:var(--r4);
  padding:20px;margin:14px 0;
  border:1px solid var(--bd);
  display:flex;justify-content:center;align-items:center;
  transition:background .3s, border-color .3s;
}
.pq img{
  width:100%;max-width:260px;height:auto;aspect-ratio:1/1;
  object-fit:contain;border-radius:12px;display:block;
}

.pdl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pdl .pdi{
  padding:12px 14px;
  background:var(--n1);
  border-radius:var(--r2);
  border:1px solid var(--bd);
  transition:background .3s, border-color .3s;
}
.pdl .pdi.full{grid-column:span 2}
.pdl .pdll{
  font-family:var(--fm);font-size:.56rem;color:var(--t4);
  text-transform:uppercase;letter-spacing:1.3px;font-weight:700;
  margin-bottom:5px;
}
.pdl .pdv{
  font-family:var(--fm);font-size:.85rem;font-weight:700;
  color:var(--t0);word-break:break-all;
}
.pdl .pdv.hl{color:var(--red)}
.pdl .pdv.sm{font-size:.74rem}

.ps{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;margin-top:14px;
  background:var(--n1);
  border:1px solid var(--bd);
  border-radius:var(--r3);
  transition:var(--tr);
}
.ps .psr{
  width:20px;height:20px;flex-shrink:0;
  border:2.5px solid var(--bd2);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ps .pst{
  font-family:var(--fh);font-weight:600;font-size:.8rem;
  color:var(--t2);flex:1;
}
.ps .pstm{
  font-family:var(--fm);font-size:.72rem;
  color:var(--t4);font-weight:600;
}
.ps.ok{
  border-color:var(--ok-b);
  background:var(--ok-s);
}
.ps.ok .pst{color:var(--ok)}
.ps.ok .psr{
  border-color:var(--ok);
  border-top-color:var(--ok);
  animation:none;
  position:relative;
}
.ps.ok .psr::after{
  content:'✓';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--ok);font-size:.72rem;font-weight:800;
}

.pr{
  display:none;margin-top:14px;padding:18px;
  background:var(--ok-s);
  border-radius:var(--r3);
  border:1px solid var(--ok-b);
  text-align:center;
}
.pr.on{display:block;animation:pnIn .3s ease}
.pr i{font-size:2rem;color:var(--ok);display:block;margin-bottom:8px}
.pr p{
  font-family:var(--fh);font-weight:800;
  font-size:.9rem;color:var(--ok);
  margin-bottom:14px;letter-spacing:.5px;
}

/* ═══════════════════════════════════════════════════════════
   IMAGE VIEWER
   ═══════════════════════════════════════════════════════════ */
.iv{
  position:fixed;inset:0;z-index:99999;
  background:rgba(0,0,0,.96);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.iv.on{display:flex}
.iv img{
  max-width:95vw;max-height:85vh;
  object-fit:contain;border-radius:12px;display:block;
}
.iv .ivc{
  position:fixed;top:20px;right:20px;
  width:46px;height:46px;border-radius:12px;
  background:rgba(255,255,255,.15);
  border:none;color:#fff;font-size:1.4rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:var(--tr);
  backdrop-filter:blur(10px);
}
.iv .ivc:hover{
  background:var(--er);
  transform:rotate(90deg);
}

/* ═══════════════════════════════════════════════════════════
   WELCOME MODAL
   ═══════════════════════════════════════════════════════════ */
.wl{
  position:fixed;inset:0;z-index:10000;
  background:rgba(9,9,11,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.wl.on{display:flex}
.wlb{
  max-width:420px;width:100%;padding:40px 32px;
  background:var(--white);
  border:1px solid var(--bd2);
  border-radius:var(--r6);
  box-shadow:var(--sh4);
  text-align:center;
  position:relative;overflow:hidden;
  animation:mbIn .4s cubic-bezier(.34,1.56,.64,1);
  transition:background .3s, border-color .3s;
}
.wlb::before{
  content:'';position:absolute;
  top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 50% 30%,var(--red-s) 0%,transparent 55%);
  pointer-events:none;
}
.wlb .wi{
  width:110px;height:110px;border-radius:26px;
  background:var(--white);
  border:3px solid var(--red);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:20px;
  box-shadow:0 12px 40px var(--red-g);
  position:relative;
  padding:12px;
  overflow:hidden;
}
.wlb .wi img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}
.wlb h2{
  font-family:var(--fh);font-weight:900;
  font-size:1.85rem;margin-bottom:8px;
  letter-spacing:5px;
}
.wlb h2 span{
  background:linear-gradient(135deg,var(--red),var(--red-l));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.wlb p{
  color:var(--t2);font-size:.85rem;
  line-height:1.7;margin-bottom:24px;
}
.wlb .wbs{display:flex;flex-direction:column;gap:10px}
.wlb .wbs .bt{width:100%;padding:16px;font-size:.85rem}
.wlb .wf{
  font-family:var(--fm);font-size:.6rem;
  color:var(--t5);margin-top:16px;
}

/* ═══════════════════════════════════════════════════════════
   FAB
   ═══════════════════════════════════════════════════════════ */
.fab-wrap{
  position:fixed;bottom:28px;right:24px;z-index:9997;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
}
.fab-menu{
  display:none;flex-direction:column;gap:8px;
  animation:fabIn .3s cubic-bezier(.34,1.56,.64,1);
}
.fab-menu.on{display:flex}
@keyframes fabIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.fab-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;border-radius:100px;
  background:var(--white);
  border:1.5px solid var(--bd2);
  color:var(--t1);font-family:var(--fh);font-weight:700;
  font-size:.82rem;cursor:pointer;transition:var(--tr);
  box-shadow:var(--sh3);white-space:nowrap;
}
.fab-item:hover{
  background:var(--red-s);border-color:var(--red);
  color:var(--red);transform:translateX(-4px);
}

  color:#fff;border:none;font-size:1.3rem;
  cursor:pointer;transition:var(--tr);
  box-shadow:0 8px 28px var(--red-g);
  display:flex;align-items:center;justify-content:center;
}
.fab-main:hover{transform:scale(1.08) rotate(15deg)}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
.color-picker-wrap{

  border-radius:var(--r3);box-shadow:var(--sh3);
  animation:fabIn .3s cubic-bezier(.34,1.56,.64,1);
}
.color-picker-wrap.on{display:flex}
.color-picker-wrap label{
  font-family:var(--fm);font-size:.6rem;color:var(--t4);
  text-transform:uppercase;letter-spacing:1px;font-weight:700;
}
.color-input{
  width:100%;height:40px;border:none;border-radius:var(--r2);
  cursor:pointer;background:var(--n1);
  padding:2px;
}
.color-presets{
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
}
.color-preset{
  width:100%;aspect-ratio:1/1;border-radius:8px;
  border:2px solid transparent;cursor:pointer;
  transition:var(--tr);
}
.color-preset:hover{transform:scale(1.15)}
.color-preset.active{border-color:var(--t0);transform:scale(1.1)}
.theme-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--n1);border-radius:var(--r2);
  cursor:pointer;transition:var(--tr);border:1px solid var(--bd);
}

   ═══════════════════════════════════════════════════════════ */

   ═══════════════════════════════════════════════════════════ */
.particle{
  position:fixed;pointer-events:none;z-index:99999;
  width:8px;height:8px;border-radius:50%;
  animation:particleFly .8s ease-out forwards;
}
@keyframes particleFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

/* ═══════════════════════════════════════════════════════════
   TYPING TITLE
   ═══════════════════════════════════════════════════════════ */
.typing-title{

  color:var(--t0);min-height:2rem;

}

  display:inline-block;width:3px;height:1.2em;
  background:var(--red);margin-left:4px;

  vertical-align:text-bottom;
}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
.marquee-wrap{

}
@keyframes marqueeScroll{

}
.marquee span{padding:0 30px}

/* ═══════════════════════════════════════════════════════════
   BANNER SHINE
   ═══════════════════════════════════════════════════════════ */
.banner-shine{
  position:relative;overflow:hidden;
}
.banner-shine::after{
  content:'';position:absolute;
  top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shine 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shine{
  0%,100%{left:-100%}
  50%{left:120%}

/* ═══════════════════════════════════════════════════════════
   BACKGROUND EFFECTS — LOGIC NỀN ĐỘNG
   ═══════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;

  const ctx = canvas.getContext('2d');
  let stars = [];

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let lastMouseX = mouseX;
  let lastMouseY = mouseY;

  function getAccentColor(){
    const style = getComputedStyle(document.body);
    return style.getPropertyValue('--red').trim() || '#dc2626';
  }

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars(){
    stars = [];
    const count = Math.min(80, Math.floor(window.innerWidth / 20));
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  function drawCanvas(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const accent = getAccentColor();

    const dx = mouseX - lastMouseX;
    const dy = mouseY - lastMouseY;
    lastMouseX += dx * 0.1;
    lastMouseY += dy * 0.1;

    stars.forEach(s => {
      s.x += s.vx + dx * 0.02;
      s.y += s.vy + dy * 0.02;
      s.pulse += 0.03;

      if(s.x < 0) s.x = canvas.width;
      if(s.x > canvas.width) s.x = 0;
      if(s.y < 0) s.y = canvas.height;
      if(s.y > canvas.height) s.y = 0;

      const pulseAlpha = s.alpha * (0.7 + 0.3 * Math.sin(s.pulse));

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = accent;
      ctx.globalAlpha = pulseAlpha;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      ctx.globalAlpha = pulseAlpha * 0.15;
      ctx.fill();
    });

    if(document.body.classList.contains('has-mouse')){
      const grd = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 200);
      grd.addColorStop(0, accent + '40');
      grd.addColorStop(1, 'transparent');
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(drawCanvas);
  }

  function updateTimeGradient(){
    const bgGradient = document.getElementById('bgGradient');
    if(!bgGradient) return;

    const h = new Date().getHours();
    let colors;

    if(h >= 5 && h < 11){
      colors = ['#1a0a0a', '#0a0a1a'];
    } else if(h >= 11 && h < 17){
      colors = ['#0a0a0a', '#1a0a0a'];
    } else if(h >= 17 && h < 21){
      colors = ['#1a0a1a', '#0a0a1a'];
    } else {
      colors = ['#050505', '#0a0510'];
    }

    if(document.body.classList.contains('dark')){
      bgGradient.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
    } else {
      bgGradient.style.background = 'linear-gradient(135deg, #f0f2f5, #e8eaee)';
    }
  }

  window.addEventListener('resize', resizeCanvas);

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    document.body.classList.add('has-mouse');
    document.body.style.setProperty('--mouse-x', (e.clientX / window.innerWidth * 100) + '%');
    document.body.style.setProperty('--mouse-y', (e.clientY / window.innerHeight * 100) + '%');
  });

  document.addEventListener('mouseleave', () => {
    document.body.classList.remove('has-mouse');
  });

  function init(){
    resizeCanvas();
    drawCanvas();
    updateTimeGradient();
  }

  window.BG = {
    updateTimeGradient: updateTimeGradient,
    init: init
  };

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

function loadSettings(){
  return new Promise((resolve)=>{
    db.ref('settings').on('value', snap=>{
      const s = snap.val() || {};
      const prevG = apiEnabled.g;
      const prevT = apiEnabled.t;
      const prevD = apiEnabled.d;
      const prevBuy = buyEnabled;

      apiEnabled.g = s.apiG !== false;
      apiEnabled.t = s.apiT !== false;
      apiEnabled.d = s.apiD !== false;
      buyEnabled = s.buyEnabled !== false;

      if(!_apiFirstLoad){
        if(prevG !== apiEnabled.g){
          toast(`API GTraffic đã ${apiEnabled.g ? 'BẬT' : 'TẮT'}`, apiEnabled.g ? 'success' : 'warning');
        }
        if(prevT !== apiEnabled.t){
          toast(`API TrafficSo1 đã ${apiEnabled.t ? 'BẬT' : 'TẮT'}`, apiEnabled.t ? 'success' : 'warning');
        }
        if(prevD !== apiEnabled.d){
          toast(`API direct.gtraffic đã ${apiEnabled.d ? 'BẬT' : 'TẮT'}`, apiEnabled.d ? 'success' : 'warning');
        }
        if(prevBuy !== buyEnabled){
          toast(`Chức năng Mua Link đã ${buyEnabled ? 'BẬT' : 'TẮT'}`, buyEnabled ? 'success' : 'warning');
        }
      }
      _apiFirstLoad = false;

      updateApiUI();

      if(isAllDisabled() && document.getElementById('bp').classList.contains('on')){
        closeBp();
        toast('Hệ thống tạm thời đóng, vui lòng quay lại sau!', 'warning');
      }

      if(!window._apiResolved){
        window._apiResolved = true;
        resolve();
      }
    }, err=>{
      console.warn('Settings listener error:', err);
      apiEnabled.g = true;
      apiEnabled.t = true;
      apiEnabled.d = true;
      buyEnabled = true;
      if(!window._apiResolved){
        window._apiResolved = true;
        resolve();
      }
    });
  });
}

function getVNDate(){
  const now = new Date();
  const vn = new Date(now.getTime() + (7 * 60 * 60 * 1000));
  return vn.toISOString().slice(0,10);
}

function readState(){
  const today = getVNDate();
  const key = 'nvanh_bp_state';
  let st = null;
  try{
    const raw = localStorage.getItem(key);
    if(raw) st = JSON.parse(raw);
  }catch(e){ st = null }
  if(!st || st.day !== today) st = { day: today, count: 0 };
  return st;
}
function writeState(st){
  try{ localStorage.setItem('nvanh_bp_state', JSON.stringify(st)); }catch(e){}
}

function readUsedApis(){
  const today = getVNDate();
  const key = 'nvanh_used_apis';
  let st = null;
  try{
    const raw = localStorage.getItem(key);
    if(raw) st = JSON.parse(raw);
  }catch(e){ st = null }
  if(!st || st.day !== today) st = { day: today, apis: [] };
  return st;
}
function writeUsedApis(st){
  try{ localStorage.setItem('nvanh_used_apis', JSON.stringify(st)); }catch(e){}
}
function markApiUsed(apiKey){
  const st = readUsedApis();
  if(!st.apis.includes(apiKey)){
    st.apis.push(apiKey);
    writeUsedApis(st);
  }
}
function isApiUsed(apiKey){
  const st = readUsedApis();
  return st.apis.includes(apiKey);
}
function isAllApiUsed(){
  const st = readUsedApis();
  return st.apis.length >= 3;
}

/* ═══════════════════════════════════════════════════════════
   CHU KỲ 7 SLOT
   ═══════════════════════════════════════════════════════════ */
function calcPair(count){
  const slot = (count % 7) + 1;
  if(slot === 1) return { qc1:'g', qc2:'g', slot };
  if(slot === 2) return { qc1:'t', qc2:'t', slot };
  if(slot === 3) return { qc1:'d', qc2:'d', slot };
  if(slot === 4) return { qc1:'g', qc2:'d', slot };
  if(slot === 5) return { qc1:'t', qc2:'g', slot };
  if(slot === 6) return { qc1:'d', qc2:'g', slot };
  return { qc1:'t', qc2:'d', slot };
}
function increaseCount(){
  const st = readState();
  st.count = st.count + 1;
  writeState(st);
}

function resolveApi(apiKey){
  if(apiEnabled[apiKey]) return apiKey;
  const order = ['g', 't', 'd'];
  for(const k of order){
    if(k !== apiKey && apiEnabled[k]) return k;
  }
  return null;
}
function isAllDisabled(){ return !apiEnabled.g && !apiEnabled.t && !apiEnabled.d; }

const AS = {
  ctx: null,
  init(){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  play(f,d,v,t='sine'){
    if(!this.ctx) return;
    try{
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      o.type = t; o.frequency.value = f;
      g.gain.value = v;
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
      o.start(this.ctx.currentTime); o.stop(this.ctx.currentTime + d);
    }catch(e){}
  },
  click(){ this.play(880,.05,.05) },
  popup(){ this.play(660,.08,.06); setTimeout(()=>this.play(880,.08,.05),100) },
  success(){ this.play(523,.1,.08); setTimeout(()=>this.play(659,.1,.06),120); setTimeout(()=>this.play(784,.12,.05),240) },
  error(){ this.play(350,.15,.08,'sawtooth') },
  toast(){ this.play(660,.04,.05) },
  download(){ this.play(440,.08,.06); setTimeout(()=>this.play(660,.08,.05),100); setTimeout(()=>this.play(880,.1,.04),200) },
  payment(){ this.play(523,.1,.08); setTimeout(()=>this.play(659,.1,.06),120); setTimeout(()=>this.play(784,.1,.05),240); setTimeout(()=>this.play(1047,.12,.04),360) }

function copy(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); res();
    }catch(e){ rej(e) }
  });
}

document.addEventListener('click', e=>{
  const b = e.target.closest('.bt');
  if(!b || b.disabled) return;
  const r = b.getBoundingClientRect();
  const s = Math.max(r.width, r.height);
  const x = e.clientX - r.left - s/2;
  const y = e.clientY - r.top - s/2;
  const rp = document.createElement('span');
  rp.className='rp';
  rp.style.width=rp.style.height=s+'px';
  rp.style.left=x+'px'; rp.style.top=y+'px';
  b.appendChild(rp);
  setTimeout(()=>rp.remove(),600);
  AS.click();
  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className='particle';
    const colors = ['#dc2626','#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'];
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 80;
    p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    p.style.width = p.style.height = (4 + Math.random()*6) + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 800);
  }
});

const CL = {filza:'FILZA','3105':'3105',ipa:'IPA',file:'FILE',apk:'APK',ios:'iOS',android:'Android',imazing:'3105'};
const CI = {filza:'fa-folder','3105':'fa-desktop',ipa:'fa-apple',file:'fa-file',apk:'fa-android',ios:'fa-apple',android:'fa-android',imazing:'fa-desktop'};

let tabsD = [];
let subsD = {};

function loadTabs(){
  db.ref('settings/tabs').once('value').then(s=>{
    let t = s.val();
    if(!t || !Array.isArray(t) || t.length===0){
      t = [
        {id:'ios',label:'iOS',icon:'fab fa-apple',visible:true},
        {id:'android',label:'ANDROID',icon:'fab fa-android',visible:true}
      ];
      db.ref('settings/tabs').set(t);
    }
    t = t.filter(x=>x.id!=='trust');
    tabsD = t;
    renderTabs();
  }).catch(()=>{
    tabsD = [
      {id:'ios',label:'iOS',icon:'fab fa-apple',visible:true},
      {id:'android',label:'ANDROID',icon:'fab fa-android',visible:true}
    ];
    renderTabs();
  });

  db.ref('settings/subTabs').once('value').then(s=>{
    subsD = s.val() || {};
    const def = {ios:['filza','3105','ipa'], android:['file','apk']};
    Object.keys(subsD).forEach(k=>{
      if(subsD[k] && Array.isArray(subsD[k])){
        subsD[k] = subsD[k].map(x=>x==='imazing'?'3105':x);
      }
    });
    delete subsD.trust;
    Object.keys(def).forEach(k=>{ if(!subsD[k]) subsD[k]=def[k] });
    db.ref('settings/subTabs').set(subsD);
    renderTabs();
  }).catch(()=>{
    subsD = {ios:['filza','3105','ipa'], android:['file','apk']};
    renderTabs();
  });
}

function renderTabs(){
  const nav = document.getElementById('tnav');
  const pnls = document.getElementById('tpnls');
  if(!tabsD.length){ nav.innerHTML = `<button class="tb on">Trang chủ</button>`; return }

  let nh='';
  let first=null;
  tabsD.forEach(t=>{
    if(t.visible===false) return;
    if(!first) first=t.id;
    nh += `<button class="tb ${t.id===first?'on':''}" data-tab="${t.id}"><i class="${t.icon||'fas fa-circle'}"></i> ${t.label}</button>`;
  });
  nav.innerHTML = nh;

  let ph='';
  tabsD.forEach(t=>{
    if(t.visible===false) return;
    const isOn = t.id===first;
    const subs = subsD[t.id] || [];
    let sn='', sp='';
    let fs=null;
    subs.forEach(s=>{
      if(!fs) fs=s;
      const lbl = CL[s] || s.toUpperCase();
      const ic = CI[s] || 'fa-folder';
      sn += `<button class="sb ${s===fs?'on':''}" data-sub="${s}"><i class="fas ${ic}"></i> ${lbl}</button>`;
      sp += `<div id="sp-${s}" class="sp ${s===fs?'on':''}"><div class="fl" id="fl-${s}"></div></div>`;
    });
    ph += `<div id="tp-${t.id}" class="pn ${isOn?'on':''}"><div class="subs">${sn}</div>${sp}</div>`;
  });
  pnls.innerHTML = ph;

  const sp = document.createElement('div');
  sp.id='srp';
  sp.className='pn';
  sp.innerHTML='<div id="srl"></div>';
  pnls.appendChild(sp);

  document.querySelectorAll('.tb').forEach(b=>{
    b.onclick = function(e){
      e.preventDefault();
      document.getElementById('srp').classList.remove('on');
      document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));
      this.classList.add('on');
      const tab = this.dataset.tab;
      document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
      const pnl = document.getElementById(`tp-${tab}`);
      if(pnl) pnl.classList.add('on');
      const sn = pnl.querySelector('.subs');
      if(sn){
        const fs = sn.querySelector('.sb');
        if(fs){
          const sk = fs.dataset.sub;
          pnl.querySelectorAll('.sp').forEach(p=>p.classList.remove('on'));
          const spp = document.getElementById(`sp-${sk}`);
          if(spp) spp.classList.add('on');
          sn.querySelectorAll('.sb').forEach(x=>x.classList.remove('on'));
          fs.classList.add('on');
          renderList(sk);
        }
      }
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });

  document.querySelectorAll('.sb').forEach(b=>{
    b.onclick = function(e){
      e.preventDefault();
      document.getElementById('srp').classList.remove('on');
      const pp = this.closest('.pn');
      pp.querySelectorAll('.sb').forEach(x=>x.classList.remove('on'));
      this.classList.add('on');
      const sk = this.dataset.sub;
      pp.querySelectorAll('.sp').forEach(p=>p.classList.remove('on'));
      const spp = document.getElementById(`sp-${sk}`);
      if(spp) spp.classList.add('on');
      renderList(sk);
    };
  });

  if(first){
    const subs = subsD[first] || [];
    if(subs.length) renderList(subs[0]);
  }
}

let searchQ = '';
let curCat = '';

function searchFiles(q){
  searchQ = q.toLowerCase().trim();
  const clr = document.getElementById('sclr');
  const sl = document.getElementById('srl');
  const sp = document.getElementById('srp');
  const cnt = document.getElementById('scnt');

  if(searchQ.length>0) clr.classList.add('on'); else clr.classList.remove('on');

  if(searchQ.length===0){
    sp.classList.remove('on');
    if(cnt) cnt.textContent='';
    const at = document.querySelector('.tb.on');
    if(at){
      const tid = at.dataset.tab;
      document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
      const p = document.getElementById(`tp-${tid}`);
      if(p) p.classList.add('on');
    }
    return;
  }

  const all = window.curFiles?.filter(f=>f.visible!==false) || [];
  const res = all.filter(f=>{
    const n = f.name.toLowerCase().includes(searchQ);
    const d = f.description && f.description.toLowerCase().includes(searchQ);
    const v = f.version && f.version.toLowerCase().includes(searchQ);
    return n||d||v;
  });

  document.querySelectorAll('.pn').forEach(p=>p.classList.remove('on'));
  sp.classList.add('on');

  if(cnt) cnt.textContent = res.length>0 ? `${res.length} kết quả` : '';

  if(res.length===0){
    sl.innerHTML = `<div class="emp"><i class="fas fa-search"></i><p>Không tìm thấy file nào cho "<strong>${esc(searchQ)}</strong>"</p></div>`;
    return;
  }

  const im = {ipa:'fa-apple',apk:'fa-android',zip:'fa-file-archive',pdf:'fa-file-pdf',doc:'fa-file-word',filza:'fa-folder','3105':'fa-desktop',file:'fa-file'};
  let h='';
  res.forEach(f=>{
    const ext = f.name ? f.name.split('.').pop().toLowerCase() : '';
    const ic = im[ext] || im[f.category] || im[f.sub] || 'fa-file';
    let cn = CL[f.category] || f.category || 'File';
    if(f.category==='imazing') cn='3105';
    h += `
      <div class="fi" data-id="${esc(f.id)}">
        <div class="fiic"><i class="fas ${ic}"></i></div>
        <div class="finfo">
          <div class="finm">${esc(f.name)}</div>
          <div class="fimt">
            <span class="fmi"><i class="fas fa-download"></i> ${fmt(f.downloadCount||0)}</span>
            <span class="tg tg-cat"><i class="fas fa-folder"></i> ${cn}</span>
            ${f.version?`<span class="tg tg-ver">${esc(f.version)}</span>`:''}
          </div>
        </div>
        <div class="fiarr"><i class="fas fa-chevron-right"></i></div>
      </div>
    `;
  });
  sl.innerHTML = h;
  sl.querySelectorAll('.fi').forEach((it,i)=>{
    const f = res[i];
    if(f) it.onclick = ()=>openFd(f);
  });
}

  i.value=''; searchQ='';

    const p = document.getElementById(`tp-${tid}`);

}

function renderList(cat){
  curCat = cat;
  const l = document.getElementById(`fl-${cat}`);
  if(!l) return;
  l.innerHTML='';
  if(window.isMt){
    l.innerHTML = `<div class="emp"><i class="fas fa-tools"></i><p>Đang bảo trì</p></div>`;
    return;
  }

  let files = window.curFiles?.filter(f=>{
    let c = f.category || f.sub || detectCat(f.name);
    if(c==='imazing') c='3105';
    return c===cat && f.visible!==false;
  }) || [];

  if(files.length===0){
    l.innerHTML = `<div class="emp"><i class="fas fa-inbox"></i><p>Chưa có file trong danh mục này</p></div>`;
    return;
  }

  let maxD=0;
  files.forEach(f=>{ if(f.downloadCount>maxD) maxD=f.downloadCount });

  const im = {ipa:'fa-apple',apk:'fa-android',zip:'fa-file-archive',pdf:'fa-file-pdf',doc:'fa-file-word',filza:'fa-folder','3105':'fa-desktop',file:'fa-file',imazing:'fa-desktop'};

  files.sort((a,b)=>(b.downloadCount||0)-(a.downloadCount||0));

  files.forEach(f=>{
    const hot = (f.downloadCount===maxD && maxD>0);
    const nw = f.createdAt && (Date.now()-f.createdAt) < 7*24*60*60*1000;
    const ext = f.name ? f.name.split('.').pop().toLowerCase() : '';
    const ic = im[ext] || im[f.category] || im[f.sub] || 'fa-file';

    const it = document.createElement('div');
    it.className='fi';
    it.innerHTML = `
      <div class="fiic"><i class="fas ${ic}"></i></div>
      <div class="finfo">
        <div class="finm">${esc(f.name)}</div>
        <div class="fimt">
          <span class="fmi"><i class="fas fa-download"></i> ${fmt(f.downloadCount||0)}</span>
          ${hot?'<span class="tg tg-hot"><i class="fas fa-fire"></i> HOT</span>':''}
          ${nw?'<span class="tg tg-new"><i class="fas fa-star"></i> NEW</span>':''}
          ${f.version?`<span class="tg tg-ver">${esc(f.version)}</span>`:''}
        </div>
      </div>
      <div class="fiarr"><i class="fas fa-chevron-right"></i></div>
    `;
    it.onclick = ()=>openFd(f);
    l.appendChild(it);
  });
}

function detectCat(name){
  if(!name) return 'file';
  const l = name.toLowerCase();
  if(l.includes('filza')) return 'filza';
  if(l.includes('3105') || l.includes('imazing')) return '3105';
  if(l.includes('.ipa') || l.includes('ipa')) return 'ipa';
  if(l.includes('.apk') || l.includes('apk')) return 'apk';
  return 'file';
}

async function loadFiles(){
  try{
    const s = await db.ref('files').once('value');
    const d = s.val() || {};
    window.curFiles = Object.keys(d).map(k=>{
      const f = {id:k, ...d[k]};
      if(f.category==='imazing') f.category='3105';
      if(f.sub==='imazing') f.sub='3105';
      return f;
    });

    window.totalDl = window.curFiles.reduce((a,f)=>a+(f.downloadCount||0),0);
    const vs = await db.ref('statistics/visits').once('value');
    window.totalVis = vs.val() || 0;

    const ms = await db.ref('settings/maintenance').once('value');
    window.isMt = ms.val() || false;

    window.allCats = new Set();
    window.curFiles.forEach(f=>{
      let c = f.category || f.sub || detectCat(f.name);
      if(c==='imazing') c='3105';
      if(c) window.allCats.add(c);
    });

    window.allCats.forEach(c=>renderList(c));
    updStats();
    checkShareRedirect();
  }catch(e){
    toast('Lỗi tải dữ liệu: '+e.message,'error');
    AS.error();
  }
}

function startBp(file){
  if(!file || !file.id){ toast('Dữ liệu file không hợp lệ!','error'); AS.error(); return }

  if(isAllDisabled()){
    toast('Hệ thống tạm thời đóng, vui lòng quay lại sau!','warning');
    AS.error();
    return;
  }

  const b = baseUrl();
  const st = readState();
  const pair = calcPair(st.count);

  const resolvedQc1 = resolveApi(pair.qc1);
  if(!resolvedQc1){
    toast('Hệ thống tạm thời đóng, vui lòng quay lại sau!','warning');
    AS.error();
    return;
  }

  sessionStorage.setItem('nvanh_bp_file_id', file.id);
  sessionStorage.removeItem('nvanh_bp_manual_api');

  const api = APIS[resolvedQc1];
  const qc1Link = api.build(b + '?step=1&id=' + file.id);

  try{
    const w = window.open(qc1Link, '_blank');
    if(!w || w.closed || typeof w.closed==='undefined'){ location.href = qc1Link; return }
    toast(`Đang mở QC1 (${api.name})...`, 'info');
  }catch(e){
    location.href = qc1Link;
  }
}

function startBpWithApi(file, apiKey){
  if(!file || !file.id){ toast('Dữ liệu file không hợp lệ!','error'); AS.error(); return }
  if(!apiEnabled[apiKey]){ toast('API này đang tắt!','warning'); AS.error(); return }
  if(isApiUsed(apiKey)){ toast('API này đã dùng hôm nay!','warning'); AS.error(); return }

  const b = baseUrl();
  sessionStorage.setItem('nvanh_bp_file_id', file.id);
  sessionStorage.setItem('nvanh_bp_manual_api', apiKey);

  const api = APIS[apiKey];
  const qc1Link = api.build(b + '?step=1&id=' + file.id);

  try{
    const w = window.open(qc1Link, '_blank');
    if(!w || w.closed || typeof w.closed==='undefined'){ location.href = qc1Link; return }
    toast(`Đang mở QC1 (${api.name})...`, 'info');
  }catch(e){
    location.href = qc1Link;
  }
}

function checkBpRedirect(){
  try{
    const u = new URLSearchParams(location.search);
    const step = u.get('step');
    const id = u.get('id');
    if(!step || !id) return;

    const f = window.curFiles?.find(x=>x.id===id);
    if(!f){ toast('File không tồn tại!','error'); AS.error(); return }

    if(step === '1'){
      redirectToQc2(f);
    } else if(step === '2'){
      finalRedirect(f);
    }
  }catch(e){ toast('Lỗi xử lý redirect!','error'); AS.error() }
}

/* ═══════════════════════════════════════════════════════════
   COLOR PICKER & THEME
   ═══════════════════════════════════════════════════════════ */
const defaultColor = '#dc2626';
const colorPresets = [
  '#dc2626','#ea580c','#eab308','#10b981',
  '#3b82f6','#8b5cf6','#ec4899','#06b6d4',
  '#84cc16','#f472b6','#6366f1','#d97706'
];

function initColorPicker(){
  const input = document.getElementById('colorInput');
  const presets = document.getElementById('colorPresets');
  const reset = document.getElementById('resetColor');
  const toggle = document.getElementById('themeToggle');
  const label = document.getElementById('themeLabel');
  const icon = document.getElementById('themeIcon');

  const saved = localStorage.getItem('nvanh_color');
  if(saved){
    input.value = saved;
    applyColor(saved);
  }

  const savedTheme = localStorage.getItem('nvanh_theme');
  if(savedTheme === 'dark'){
    document.body.classList.add('dark');
    label.textContent = '☀️ Sáng';
    icon.className = 'fas fa-sun';
    if(window.BG) window.BG.updateTimeGradient();
  }

  colorPresets.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'color-preset';
    el.style.background = c;
    el.onclick = ()=>{ input.value = c; applyColor(c); localStorage.setItem('nvanh_color', c); AS.click() };
    presets.appendChild(el);
  });

  input.oninput = function(){
    applyColor(this.value);
    localStorage.setItem('nvanh_color', this.value);
  };

  reset.onclick = ()=>{
    input.value = defaultColor;
    applyColor(defaultColor);
    localStorage.setItem('nvanh_color', defaultColor);
    AS.click();
  };

  toggle.onclick = ()=>{
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('nvanh_theme', isDark ? 'dark' : 'light');
    label.textContent = isDark ? '☀️ Sáng' : '🌙 Tối';
    icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    if(window.BG) window.BG.updateTimeGradient();
    AS.click();
  };
}

function applyColor(hex){
  const root = document.documentElement;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const rd = Math.max(0, r-40);
  const gd = Math.max(0, g-40);
  const bd = Math.max(0, b-40);
  root.style.setProperty('--red', hex);
  root.style.setProperty('--red-d', `rgb(${rd},${gd},${bd})`);
  root.style.setProperty('--red-l', `rgb(${Math.min(255,r+20)},${Math.min(255,g+20)},${Math.min(255,b+20)})`);
  root.style.setProperty('--red-s', `rgba(${r},${g},${b},.08)`);
  root.style.setProperty('--red-b', `rgba(${r},${g},${b},.18)`);
  root.style.setProperty('--red-g', `rgba(${r},${g},${b},.28)`);
}

        <strong style="color:var(--ok);font-size:.88rem;">🛡️ VỀ MẶT AN TOÀN</strong>

        </p>

async function init(){
  renderApp();
  initColorPicker();
  initFab();
  await loadSettings();
  await loadLinks();
  await loadTabs();
  await loadFiles();
  checkBpRedirect();

  setTimeout(()=>{ incVisits() },1000);

  const h = new Date().getHours();
  let msg='';
  if(h>=5 && h<10) msg='🌅 Chúc bạn một buổi sáng tốt lành!';
  else if(h>=10 && h<14) msg='☀️ Chúc bạn một buổi trưa vui vẻ!';
  else if(h>=14 && h<18) msg='🌇 Chúc bạn một buổi chiều ấm áp!';
  else if(h>=18 && h<22) msg='🌙 Chúc bạn một buổi tối thư giãn!';
  else msg='🌌 Chúc bạn một đêm an lành!';
  document.getElementById('ftm').textContent = msg;

  const urlParams = new URLSearchParams(location.search);
  const isBypassFlow = urlParams.get('step') !== null;

  if(!isBypassFlow){
    setTimeout(()=>{ showWelcome() },600);
    setTimeout(()=>{ showTermsIfNeeded() },1200);
  }

  if(window._lfi){ clearInterval(window._lfi); window._lfi=null }
  window._lfi = setInterval(loadFiles, 30000);
}

window.addEventListener('beforeunload', ()=>{
  if(window._lfi){ clearInterval(window._lfi); window._lfi=null }
  if(payI){ clearInterval(payI); payI=null; isPay=false }
  if(welcomeCountdownTimer){ clearInterval(welcomeCountdownTimer); welcomeCountdownTimer=null }
});

init();
